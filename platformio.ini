[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.4.12

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py
  post:scripts/gen_manifest.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; ---------------------------------------------------------------------------
; BLE keyboard (text-entry) build — OFF by default, excluded from slim.
; Adds NimBLE-Arduino (h2zero) as a BLE central / HID host, gated behind
; -DENABLE_BLE_KEYBOARD so the default/slim firmware is byte-for-byte unaffected
; (NimBLE + the Notes feature only exist in guarded TUs, compiled out otherwise).
; Enables the "Notes" typewriter feature: Home > Notes (list + editor with
; windowed fast-refresh typing), Settings > Keyboard (pair/forget), plus the
; TEMP `CMD:BLEGATE` §6 RAM harness (kept for now; NOTE: the harness's
; deinit(true) clears bonds — re-pair after running it).
; See docs/BLE-KEYBOARD-PLAN.md.
[env:ble]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-ble\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2      ; debug logging so CMD:BLEGATE output is visible
  -DENABLE_BLE_KEYBOARD
  ; --- NimBLE tuning: TESTED AND REVERTED (2026-07-01) ---
  ; The §6 tune-and-remeasure pass tried MAX_CONNECTIONS=1, MTU=23, MSYS1_BLOCK_COUNT=8,
  ; MAX_BONDS=2, MAX_CCCDS=4 (clean rebuild, macros verified against nimconfig.h). Result:
  ; POSTINIT heap byte-identical (36,040) — the ~63 KB init cost is the precompiled controller
  ; + fixed host, NOT tunable host pools — and the reduced pools made connect() fail
  ; deterministically. Conclusion: no host-side heap to recover; run with library defaults.
lib_deps =
  ${base.lib_deps}
  ; NimBLE-Arduino 2.x = the Arduino-framework packaging of the same stack MicroSlate
  ; ships as esp-nimble-cpp 2.x. 2.x is required for arduino-esp32 3.x (pioarduino platform).
  h2zero/NimBLE-Arduino@^2.2.3
